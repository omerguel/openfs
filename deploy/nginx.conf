# OpenFS behind nginx (alternative to Caddy). Certificates via certbot:
#   certbot certonly --webroot -w /var/www/letsencrypt -d fahrschule-muster.de
# (multi-tenant: a wildcard certificate needs certbot with a DNS plugin,
#  e.g. certbot-dns-hetzner, for "openfs.de" and "*.openfs.de").
# Install to /etc/nginx/sites-available/openfs, link into sites-enabled,
# then: nginx -t && systemctl reload nginx
#
# OpenFS runs on 127.0.0.1:3000 with TRUST_PROXY=1.

server {
    listen 80;
    listen [::]:80;
    server_name fahrschule-muster.de;          # multi-tenant: openfs.de *.openfs.de;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # Works on nginx 1.18–1.24 (Debian 12, Ubuntu 24.04). From 1.25.1 on,
    # write "listen 443 ssl;" plus "http2 on;" instead.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fahrschule-muster.de;          # multi-tenant: openfs.de *.openfs.de;

    ssl_certificate     /etc/letsencrypt/live/fahrschule-muster.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fahrschule-muster.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # HSTS: start with a short max-age, raise to a year once HTTPS works.
    # Multi-tenant: add "; includeSubDomains".
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    # Uploads are capped at 12 MB by OpenFS.
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # $http_host keeps a non-default port (the Origin check compares
        # host:port); $host would drop it.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite (not append) — OpenFS trusts the last entry only.
        proxy_set_header X-Forwarded-For   $remote_addr;
        # Backup archives can be large: stream them, don't buffer to disk.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    access_log /var/log/nginx/openfs-access.log;
    error_log  /var/log/nginx/openfs-error.log;
}
