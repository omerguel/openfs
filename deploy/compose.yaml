# docker compose -f deploy/compose.yaml up -d --build
# OpenFS listens on 127.0.0.1:3000 of the host only; put Caddy (deploy/Caddyfile)
# or nginx in front for HTTPS. Data (database, documents, backups) lives in
# the "openfs-data" volume — copy /data/backups off the host regularly.
#
# Restore (see docs/operations.md):
#   docker compose -f deploy/compose.yaml stop openfs
#   docker compose -f deploy/compose.yaml run --rm openfs bun run restore list
#   docker compose -f deploy/compose.yaml run --rm openfs bun run restore restore <name>
#   docker compose -f deploy/compose.yaml start openfs

name: openfs

services:
  openfs:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: openfs:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    # SMTP_*, S3_*, MULTI_TENANT/BASE_DOMAIN … — the data paths, HOST, PORT
    # and TRUST_PROXY are set by the image; don't override them here.
    env_file:
      - path: ./openfs.env
        required: false
    environment:
      # The container always listens on all its interfaces; the port is
      # published on the host's loopback only (above).
      HOST: 0.0.0.0
    volumes:
      - openfs-data:/data
    stop_grace_period: 20s

volumes:
  openfs-data:
